# CinePlay —— 服务端指令控制装了 CineDuct 模组的客户端播放
#
# 注意：客户端的闸门默认是关的（<游戏目录>/cineduct-packet.json 里 enabled=false）。
# 插件这边配好了、客户端没开，服务端发出去的包会被客户端直接拒掉并记一行日志。

# 共享令牌：与客户端 cineduct-packet.json 里的 token 一致；两边都留空 = 不校验。
token: ""

# 玩家没切换过槽位时用哪个（/cineplay slot <名字> 可以按玩家改）。
defaultSlot: main


# 需要大会员的付费内容，非大会员能试看的秒数（B 站通常 6 分钟 = 360）。
# 服务端没法知道每个客户端是不是大会员，所以默认按试看时长截断自动推进：
# 宁可早一点切下一条，也不要"画面早停了、服务端还以为在播"。
# 0 = 不截断（全服都是大会员时可用）。单个视频想按完整时长走，用 /cineplay add <屏幕> <链接> <秒> 手填。
premiumPreviewSeconds: 360

# /cineplay play 的最小间隔（毫秒）：防止手滑连点把客户端刷成反复重开。
# 0 = 不限制。
playCooldownMs: 1500

# 是否要求客户端先通告监听 cineduct:control 才发。
#
# 默认 false：NeoForge 客户端是否通过 Bukkit 的 register 机制通告通道，各版本行为不一致，
# 拿它当硬门禁会出现"客户端明明装了就发不出去"。发送一个没人监听的通道对原版客户端无副作用
# （服务端只会在日志里看到一条 ignored 警告），所以默认"发就完事"。
requireChannel: false
