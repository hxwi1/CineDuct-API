name: CinePlay
version: ${version}
main: dev.cineduct.paper.CinePlayPlugin
api-version: '1.21'
authors: [hxwi1]
description: 用服务端指令控制装了 CineDuct 模组的客户端播放（走 cineduct:control 插件通道）。
website: https://github.com/hxwi1/CineDuct-API
commands:
  cineplay:
    description: 控制装了 CineDuct 模组的客户端播放
    usage: /cineplay <play|broadcast|pause|resume|stop|seek|volume|status|help>
    permission: cineplay.admin
permissions:
  cineplay.admin:
    description: 允许使用 /cineplay 的全部子指令
    default: op
